function dec(b){try{return decodeURIComponent(escape(atob(b)))}catch(e){return atob(b)}}
let cur=0;
const tabsEl=document.getElementById('tabs');
const frame=document.getElementById('frame');
const head=document.getElementById('head');
function sync(){document.documentElement.style.setProperty('--hh',head.offsetHeight+'px')}
function render(){tabsEl.innerHTML='';DATA.forEach((t,i)=>{const b=document.createElement('button');b.className='tab'+(i===cur?' active':'');b.textContent=(i+1)+'. '+t.name;b.onclick=()=>go(i);tabsEl.appendChild(b)})}
function go(i){cur=i;frame.srcdoc=dec(DATA[i].b64);render();const a=tabsEl.children[i];if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
function left(){tabsEl.scrollBy({left:-300,behavior:'smooth'})}
function right(){tabsEl.scrollBy({left:300,behavior:'smooth'})}
document.getElementById('lBtn').addEventListener('click', left);
document.getElementById('rBtn').addEventListener('click', right);
document.getElementById('lBtn').addEventListener('touchstart', left, {passive:true});
document.getElementById('rBtn').addEventListener('touchstart', right, {passive:true});
document.getElementById('cBtn').addEventListener('click', ()=>{const bar=document.getElementById('bar');bar.style.display=bar.style.display==='none'?'flex':'none';sync()});
render(); go(0); sync(); window.addEventListener('resize',sync);
</script></body></html>
