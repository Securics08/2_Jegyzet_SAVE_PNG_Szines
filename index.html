<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SECURICS V31 - aktív fül effekt + fejléc kép</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{--a:#00FF00;--bg:#080a0f;--panel:rgba(16,18,24,.96);--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:var(--bg);color:#e8eaf0;font-family:Geist,sans-serif;overflow-x:hidden}
.top{position:sticky;top:0;z-index:100;width:100%;padding:10px 14px 8px;background:rgba(16,18,24,.98);backdrop-filter:blur(28px);border-bottom:2px solid var(--a);box-shadow:0 4px 20px rgba(0,255,0,.12)}
.top-row{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--a);box-shadow:0 0 16px var(--a);flex:0 0 10px}
