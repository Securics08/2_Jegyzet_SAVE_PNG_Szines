<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SECURICS V8 • Elegáns + Működő</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
:root{--a:#5AFF8A;--bg:#07080A;--panel:#12141B;--panel2:#1E202B;--line:rgba(255,255,255,0.08);--line2:#2A2D3A;--muted:#9AA3B8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:#fff;font-family:'Geist',Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
#aurora{position:fixed;inset:0;pointer-events:none !important;z-index:0;opacity:0.9;background:
radial-gradient(680px 420px at 14% 8%, color-mix(in srgb, var(--a) 22%, transparent), transparent 62%),
radial-gradient(820px 560px at 88% -8%, rgba(138,90,255,0.14), transparent 68%),
radial-gradient(620px 520px at 50% 118%, rgba(90,182,255,0.09), transparent 66%);}
#head{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(18,20,27,0.98);border-bottom:1px solid rgba(255,255,255,0.08);border-radius:0 0 22px 22px;padding:12px 14px;backdrop-filter:none;-webkit-backdrop-filter:none}
#topRow{display:flex;align-items:center;gap:10px;min-width:0}
.brandDot{width:10px;height:10px;min-width:10px;border-radius:50%;background:var(--a);box-shadow:0 0 14px var(--a),0 0 28px color-mix(in srgb, var(--a) 40%, transparent);flex-shrink:0}
#titlePill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-width:120px;max-width:min(62vw,560px)}
#titleInput{border:0;outline:0;background:transparent;color:#fff;font-weight:600;font-size:13px;letter-spacing:-0.01em;min-width:60px;width:160px}
#titleHint{font-size:10px;letter-spacing:0.02em;color:var(--muted);white-space:nowrap;user-select:none;opacity:0.9}
.spacer{flex:1}
.iconBtn{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:manipulation;flex-shrink:0;transition:.15s}
.iconBtn:hover{background:var(--a);color:#000;border-color:var(--a)}
#accentInput{width:36px;height:36px;min-width:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);padding:2px;cursor:pointer;flex-shrink:0;pointer-events:auto}
#accentInput::-webkit-color-swatch{border-radius:50%;border:0}
#accentInput::-moz-color-swatch{border-radius:50%;border:0}
#bar{display:flex;align-items:center;gap:8px;margin-top:12px;position:relative;z-index:101;min-width:0}
.scrollBtn{width:36px;height:36px;min-width:36px;border-radius:50%;background:#1E202B;border:1px solid #2A2D3A;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:manipulation;flex-shrink:0;transition:.15s;user-select:none;-webkit-user-select:none}
.scrollBtn:hover{background:var(--a);color:#000;border-color:var(--a)}
.scrollBtn:active{transform:scale(0.96)}
#tabs{flex:1;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;white-space:nowrap;scrollbar-width:thin;padding:2px 0;min-width:0;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#tabs::-webkit-scrollbar{height:5px}
#tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:999px}
#tabs.dragging{cursor:grabbing;scroll-behavior:auto}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#9AA3B8;font-size:12px;font-weight:500;letter-spacing:-0.01em;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,0.10);color:#fff}
.tab.active{background:var(--a);color:#000;font-weight:700;border-color:var(--a);box-shadow:0 0 0 1px color-mix(in srgb, var(--a) 30%, transparent),0 4px 18px color-mix(in srgb, var(--a) 22%, transparent)}
#stage{position:relative;z-index:1;transition:padding-top .2s ease}
#frame{width:100%;height:calc(100vh - 88px);min-height:520px;border:0;display:block;background:#0B0C10}
#moreMenu{position:fixed;top:86px;right:14px;z-index:120;width:min(360px,92vw);max-height:min(70vh,560px);overflow:auto;background:rgba(18,20,27,0.98);border:1px solid rgba(255,255,255,0.10);border-radius:18px;padding:10px;display:none;grid-template-columns:1fr;gap:8px;box-shadow:0 20px 60px rgba(0,0,0,0.55)}
.gridTab{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#D0D6E2;text-align:left;font-size:12.5px;cursor:pointer;transition:.15s}
.gridTab:hover{background:rgba(255,255,255,0.10);color:#fff}
.gridTab.active{background:var(--a);color:#000;font-weight:700;border-color:var(--a)}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid var(--line)}
@media(max-width:640px){
  #head{padding:10px 10px;border-radius:0 0 18px 18px}
  #titlePill{max-width:46vw}
  #titleHint{display:none}
  #frame{height:calc(100dvh - 84px)}
}
</style>
</head>
<body>
<div id="aurora"></div>
<div id="head">
  <div id="topRow">
    <div class="brandDot" title="SECURICS"></div>
    <div id="titlePill">
      <input id="titleInput" value="SECURICS V8 • Elegáns + Működő" spellcheck="false" autocomplete="off"/>
    </div>
    <span id="titleHint">szerkeszthető → tágul</span>
    <div class="spacer"></div>
    <span class="badge" style="display:none" id="countBadge"></span>
    <input type="color" id="accentInput" value="#5AFF8A" title="Accent"/>
    <button class="iconBtn" id="collapseBtn" title="Összecsuk / kinyit">↕</button>
    <button class="iconBtn" id="wrapBtn" title="Sortörés">↩</button>
    <button class="iconBtn" id="moreBtn" title="Összes oldal">⋯</button>
  </div>
  <div id="bar">
    <button class="scrollBtn" id="lBtn" aria-label="Balra">‹</button>
    <div id="tabs"></div>
    <button class="scrollBtn" id="rBtn" aria-label="Jobbra">›</button>
  </div>
</div>
<div id="stage"><iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe></div>
<div id="moreMenu"></div>

const PROTECT = true;
let cur = 0;
const tabsEl = document.getElementById('tabs');
const frame = document.getElementById('frame');
const head = document.getElementById('head');
const moreMenu = document.getElementById('moreMenu');
const titleInput = document.getElementById('titleInput');
const accentInput = document.getElementById('accentInput');
const bar = document.getElementById('bar');
const countBadge = document.getElementById('countBadge');

function dec(b64){
  try{
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }catch(e){
    try{ return decodeURIComponent(escape(atob(b64))); }catch{ return atob(b64); }
  }
}
function protectHtml(html){
  if(!PROTECT) return html;
  const meta = '<meta name="google" content="notranslate"><meta name="robots" content="notranslate"><style>html{translate:no} .notranslate{translate:no}</style>';
  let out = html;
  if(/<head[^>]*>/i.test(out)){
    out = out.replace(/<head[^>]*>/i, m=>m+meta);
  }else if(/<html[^>]*>/i.test(out)){
    out = out.replace(/<html[^>]*>/i, m=>m+'<head>'+meta+'</head>');
  }else{
    out = '<head>'+meta+'</head>'+out;
  }
  if(!/translate=/.test(out.slice(0,1000))){
    out = out.replace(/<html/i, '<html translate="no" class="notranslate"');
  }
  if(!/class="notranslate"/.test(out)){
    out = out.replace(/<body[^>]*>/i, m=>{
      if(/class=/.test(m)) return m.replace(/class="/, 'class="notranslate ');
      return m.replace('>', ' class="notranslate">');
    });
  }
  return out;
}
function sync(){
  const h = head.offsetHeight;
  document.getElementById('stage').style.paddingTop = h + 'px';
  if(frame){
    frame.style.height = 'calc(100vh - ' + h + 'px)';
    frame.style.minHeight = '420px';
  }
  if(countBadge){
    countBadge.textContent = (cur+1)+' / '+DATA.length;
    countBadge.style.display = DATA.length>1 ? 'inline-flex' : 'none';
  }
}
function render(){
  tabsEl.innerHTML='';
  DATA.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===cur?' active':'');
    const clean = d.name.replace(/\.html?$/i,'').slice(0,28);
    b.textContent = (i+1)+'. '+clean;
    b.title = d.name;
    b.onclick=()=>go(i);
    tabsEl.appendChild(b);
  });
  if(moreMenu){
    moreMenu.innerHTML='';
    const headRow=document.createElement('div');
    headRow.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:2px 2px 6px 2px';
    headRow.innerHTML='<div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9AA3B8">Oldalak • '+DATA.length+'</div><div style="font-size:10px;color:#6B7280">ESC bezár</div>';
    moreMenu.appendChild(headRow);
    DATA.forEach((d,i)=>{
      const b=document.createElement('button');
      b.className='gridTab'+(i===cur?' active':'');
      b.textContent=(i+1)+'. '+d.name;
      b.onclick=()=>{go(i);moreMenu.style.display='none';};
      moreMenu.appendChild(b);
    });
    if(PROTECT){
      const p=document.createElement('div');
      p.style.cssText='margin-top:6px;padding:10px 12px;border-radius:12px;background:rgba(182,255,90,0.10);border:1px dashed rgba(182,255,90,0.28);color:#C8E9A0;font-size:11.5px;line-height:1.4';
      p.innerHTML='🛡️ <b>Védett mód</b> aktív – Google Fordító blokkolva (notranslate). A beágyazott oldalak nem fordítódnak automatikusan.';
      moreMenu.appendChild(p);
    }
  }
}
function go(i){
  if(i<0||i>=DATA.length) return;
  cur=i;
  try{
    let html = dec(DATA[i].b64);
    html = protectHtml(html);
    frame.srcdoc = html;
  }catch(e){
    frame.srcdoc = '<div style="padding:24px;font-family:monospace;color:#FF8A8A">Hiba betöltéskor: '+e+'</div>';
  }
  render();
  sync();
  requestAnimationFrame(()=>{
    const active = tabsEl.querySelector('.tab.active');
    if(active) active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  });
}
window.sLeft = ()=>tabsEl.scrollBy({left:-320,behavior:'smooth'});
window.sRight = ()=>tabsEl.scrollBy({left:320,behavior:'smooth'});

document.addEventListener('DOMContentLoaded', ()=>{
  function resizeTitle(){
    if(!titleInput) return;
    titleInput.style.width='0px';
    const w = Math.max(120, Math.min(560, titleInput.scrollWidth+10));
    titleInput.style.width = w+'px';
  }
  if(titleInput){
    titleInput.addEventListener('input', resizeTitle);
    resizeTitle();
  }
  if(accentInput){
    accentInput.addEventListener('input', e=>{
      const v = e.target.value;
      document.documentElement.style.setProperty('--a', v);
    });
  }
  const lBtn=document.getElementById('lBtn');
  const rBtn=document.getElementById('rBtn');
  if(lBtn){
    lBtn.addEventListener('click', ()=>window.sLeft());
    lBtn.addEventListener('touchstart', ()=>window.sLeft(), {passive:true});
    lBtn.addEventListener('pointerdown', ()=>window.sLeft());
  }
  if(rBtn){
    rBtn.addEventListener('click', ()=>window.sRight());
    rBtn.addEventListener('touchstart', ()=>window.sRight(), {passive:true});
    rBtn.addEventListener('pointerdown', ()=>window.sRight());
  }
  let isDown=false, startX=0, scrollLeft=0;
  tabsEl.addEventListener('mousedown', e=>{
    isDown=true; tabsEl.classList.add('dragging');
    startX=e.pageX - tabsEl.offsetLeft;
    scrollLeft=tabsEl.scrollLeft;
  });
  window.addEventListener('mouseup', ()=>{ isDown=false; tabsEl.classList.remove('dragging'); });
  tabsEl.addEventListener('mousemove', e=>{
    if(!isDown) return;
    e.preventDefault();
    const x=e.pageX - tabsEl.offsetLeft;
    const walk=(x-startX)*1.5;
    tabsEl.scrollLeft=scrollLeft - walk;
  });
  tabsEl.addEventListener('touchstart', e=>{
    isDown=true;
    startX=e.touches[0].pageX - tabsEl.offsetLeft;
    scrollLeft=tabsEl.scrollLeft;
  }, {passive:true});
  tabsEl.addEventListener('touchend', ()=>{ isDown=false; }, {passive:true});
  tabsEl.addEventListener('touchmove', e=>{
    if(!isDown) return;
    const x=e.touches[0].pageX - tabsEl.offsetLeft;
    const walk=(x-startX)*1.5;
    tabsEl.scrollLeft=scrollLeft - walk;
  }, {passive:true});
  tabsEl.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      tabsEl.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, {passive:false});

  const collapseBtn=document.getElementById('collapseBtn');
  let collapsed=false;
  if(collapseBtn){
    collapseBtn.addEventListener('click', ()=>{
      collapsed=!collapsed;
      bar.style.display = collapsed ? 'none' : 'flex';
      collapseBtn.style.background = collapsed ? 'var(--a)' : '';
      collapseBtn.style.color = collapsed ? '#000' : '';
      collapseBtn.textContent = collapsed ? '↕' : '↕';
      sync();
    });
  }
  const wrapBtn=document.getElementById('wrapBtn');
  let wrapped=false;
  if(wrapBtn){
    wrapBtn.addEventListener('click', ()=>{
      wrapped=!wrapped;
      tabsEl.style.flexWrap = wrapped ? 'wrap' : 'nowrap';
      tabsEl.style.whiteSpace = wrapped ? 'normal' : 'nowrap';
      tabsEl.style.overflowX = wrapped ? 'visible' : 'auto';
      wrapBtn.style.background = wrapped ? 'var(--a)' : '';
      wrapBtn.style.color = wrapped ? '#000' : '';
      sync();
    });
  }
  const moreBtn=document.getElementById('moreBtn');
  if(moreBtn && moreMenu){
    moreBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const isHidden = moreMenu.style.display==='none' || !moreMenu.style.display || moreMenu.style.display==='';
      moreMenu.style.display = isHidden ? 'grid' : 'none';
    });
    document.addEventListener('click', (e)=>{
      if(!moreMenu.contains(e.target) && e.target!==moreBtn) moreMenu.style.display='none';
    });
    document.addEventListener('keydown', (e)=>{
      if(e.key==='Escape') moreMenu.style.display='none';
    });
  }
  window.addEventListener('resize', sync);
  render();
  if(DATA.length) go(0);
  sync();
});
</script>
</body>
</html>
