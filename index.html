html,body{margin:0;height:100%;background:var(--bg);color:#e9eaf0;font-family:Geist,system-ui,sans-serif;overflow:hidden}
.top{position:sticky;top:12px;z-index:20;margin:12px auto;width:min(1260px,calc(100vw - 24px));padding:10px 14px 10px;background:var(--panel);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.top .aurora{position:absolute;inset:0;overflow:hidden;border-radius:22px;pointer-events:none}
.top .aurora i{position:absolute;width:220px;height:220px;border-radius:50%;filter:blur(44px);background:var(--a);will-change:transform}
.top .aurora i:nth-child(1){left:-20px;top:-70px;opacity:.22}
.top .aurora i:nth-child(2){left:38%;top:-90px;opacity:.12}
.top .aurora i:nth-child(3){right:-30px;top:-50px;opacity:.18}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a);flex:0 0 10px}
.center-wrap{display:flex;align-items:center;justify-content:center;flex:1;min-width:0}
.editable-pill{display:inline-flex;align-items:center;gap:10px;padding:6px 12px 6px 16px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);max-width:58vw;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}

.editable-pill #editableTitle:empty:before{content:attr(data-placeholder);color:rgba(255,255,255,.38)}
.hint{font-family:"Geist Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.42);white-space:nowrap;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.colorpick{display:flex;align-items:center;gap:10px;position:relative}
.swatch{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.22);overflow:hidden;padding:0;appearance:none;background:transparent;cursor:pointer;flex:0 0 24px}
.swatch::-webkit-color-swatch-wrapper{padding:0}
.swatch::-webkit-color-swatch{border:none}
#hexLabel{font-family:"Geist Mono",monospace;font-size:11px;color:rgba(255,255,255,.68);min-width:66px}
.presets{display:flex;gap:6px;align-items:center}
.presets button{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.18);cursor:pointer;transition:transform .15s}
.presets button:hover{transform:scale(1.15)}
.tabs{margin-top:12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;position:relative}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);color:rgba(255,255,255,.72);font-size:13px;cursor:pointer;white-space:nowrap;transition:.18s;font-weight:450}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab.active{background:var(--a);color:#0a0a0a;border-color:var(--a);font-weight:600;box-shadow:0 0 0 1px var(--a),0 4px 18px color-mix(in srgb,var(--a) 35%,transparent)}
.stage{position:relative;width:100%;height:calc(100vh - var(--hh) - 24px);margin:0 auto}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
@media(max-width:720px){.top-row{flex-wrap:wrap}.center-wrap{order:3;width:100%;justify-content:flex-start}.editable-pill{max-width:88vw}#editableTitle{max-width:88vw}}
</style>

const PRESET_LIST = ["#B6FF5A","#5A8CFF","#FF5A8A","#FFD15A","#5AFFD1","#D15AFF","#FF7A45","#FFFFFF","#8AFF5A"];
function b64ToUtf8(b64){try{const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}catch(e){try{return atob(b64);}catch{return "";}}}
function shadeColor(hex, amt){let c=hex.replace("#","");if(c.length===3)c=c.split("").map(x=>x+x).join("");const num=parseInt(c,16);let r=(num>>16)+amt;let g=((num>>8)&255)+amt;let b=(num&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return "#"+( (1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1).toUpperCase();}
function applyAccent(hex){
  document.documentElement.style.setProperty("--a", hex);
  const sw=document.getElementById("swatch"); if(sw) sw.value=hex;
  const hx=document.getElementById("hexLabel"); if(hx) hx.textContent=hex.toUpperCase();
  try{localStorage.setItem("securics_ultimate_accent", hex);}catch(e){}
}
function updateW(){
  const el=document.getElementById("editableTitle");
  if(!el) return;
  el.style.width="auto";
  const max=window.innerWidth*0.58;
  const cap = window.innerWidth<720 ? window.innerWidth*0.88 : max;
  const w=Math.min(Math.max(el.scrollWidth+4,60),cap);
  el.style.width=w+"px";
  syncH();
}
function syncH(){
  const head=document.getElementById("topHead");
  if(!head) return;
  const h=head.offsetHeight+24;
  document.documentElement.style.setProperty("--hh", h+"px");
}
function switchTool(idx){
  const tabs=document.querySelectorAll(".tab");
  tabs.forEach(t=>t.classList.remove("active"));
  const cur=document.querySelector('.tab[data-idx="'+idx+'"]');
  if(cur) cur.classList.add("active");
  const raw=TOOLS_DATA[idx]; if(!raw) return;
  let html=b64ToUtf8(raw.b64);
  if(FIX_GOOGLE && html.toLowerCase().includes("translate.google.com")){
    html='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e8eaf0;font-family:Geist,sans-serif} .card{width:min(460px,92vw);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px;text-align:center;backdrop-filter:blur(20px)} h3{margin:0 0 8px;font-size:18px} p{margin:0 0 18px;color:rgba(255,255,255,.66);font-size:14px;line-height:1.5} button{background:var(--a,#B6FF5A);color:#0a0a0a;border:0;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;font-family:Geist,sans-serif} button:hover{filter:brightness(1.05)}</style></head><body><div class="card"><h3>Google Translate védelem</h3><p>Ez a fájl Google fordító linket tartalmaz, ami offline nézetben nem működik. Megnyithatod külön lapon, vagy cseréld a tartalmat.</p><button onclick="window.open(&quot;https://translate.google.com/?sl=auto&tl=hu&op=images&quot;,&quot;_blank&quot;)">Megnyitás fordítóban</button></div></body></html>';
  }
  const frame=document.getElementById("frame");
  if(frame){ frame.srcdoc=html; }
  try{localStorage.setItem("securics_ultimate_last", String(idx));}catch(e){}
}
document.addEventListener("DOMContentLoaded", function(){
  const tabsEl=document.getElementById("tabs");
  TOOLS_DATA.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===0?" active":"");
    b.dataset.idx=String(i);
    b.textContent=(i+1)+". "+t.name;
    b.addEventListener("click", ()=>switchTool(i));
    if(tabsEl) tabsEl.appendChild(b);
  });
  const presetsEl=document.getElementById("presets");
  PRESET_LIST.forEach(col=>{
    const pb=document.createElement("button");
    pb.style.background=col;
    pb.title=col;
    pb.addEventListener("click", ()=>applyAccent(col));
    if(presetsEl) presetsEl.appendChild(pb);
  });
  const titleEl=document.getElementById("editableTitle");
  let savedTitle=""; let savedAccent=""; let savedLast="0";
  try{savedTitle=localStorage.getItem("securics_ultimate_title")||""; savedAccent=localStorage.getItem("securics_ultimate_accent")||"#B6FF5A"; savedLast=localStorage.getItem("securics_ultimate_last")||"0";}catch(e){}
  if(titleEl){
    if(savedTitle) titleEl.textContent=savedTitle;
    titleEl.addEventListener("input", function(){
      updateW();
      try{localStorage.setItem("securics_ultimate_title", titleEl.textContent||"");}catch(e){}
    });
    titleEl.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); titleEl.blur(); } });
  }
  if(savedAccent) applyAccent(savedAccent);
  const sw=document.getElementById("swatch");
  if(sw){ sw.addEventListener("input", function(e){ const v=e.target.value; applyAccent(v); }); }
  updateW(); syncH();
  window.addEventListener("resize", function(){ updateW(); syncH(); });
  const lastIdx=Math.min(Math.max(parseInt(savedLast||"0",10)||0,0), TOOLS_DATA.length-1);
  if(TOOLS_DATA.length>0) switchTool(lastIdx);
});
</script>
