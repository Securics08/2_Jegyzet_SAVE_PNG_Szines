<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SECURICS V31 - aktív fül effekt + fejléc kép</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{--a:#00FF00;--bg:#080a0f;--panel:rgba(16,18,24,.96);--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:var(--bg);color:#e8eaf0;font-family:Geist,sans-serif;overflow-x:hidden}
.top{position:sticky;top:0;z-index:100;width:100%;padding:10px 14px 8px;background:rgba(16,18,24,.98);backdrop-filter:blur(28px);border-bottom:2px solid var(--a);box-shadow:0 4px 20px rgba(0,255,0,.12)}
.top-row{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--a);box-shadow:0 0 16px var(--a);flex:0 0 10px}
.center{flex:1;display:flex;justify-content:center;min-width:0}
.pill{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);max-width:42vw;white-space:nowrap;overflow:hidden}
#title{outline:none;font-size:14px;font-weight:600;min-width:60px}
#hex{font-family:Geist Mono,monospace;font-size:10px;color:rgba(255,255,255,.55);min-width:56px}
.swatch{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.2);padding:0;background:transparent;cursor:pointer;flex:0 0 22px}
.custom-dropdown{position:relative;min-width:172px;flex:0 0 auto}
.dd-trigger{width:100%;padding:7px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#0f1218;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#0a0d12;border:1px solid rgba(255,255,255,.12);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7);display:none;z-index:100;max-height:340px;overflow-y:auto}
.dd-menu.open{display:block}
.dd-item{padding:7px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.04)}
.dd-item:hover{background:rgba(255,255,255,.07);color:#fff}
.dd-item .star{font-size:13px;flex:0 0 14px;text-align:center}
.c-zold{color:#00FF00}.c-cian{color:#00FFFF}.c-sarga{color:#FFFF00}.c-magenta{color:#FF00FF}.c-narancs{color:#FF8800}.c-piros{color:#FF0000}.c-kek{color:#2A7FFF}.c-feher{color:#FFFFFF}
.c-menta{color:#5AFFB6}.c-lime{color:#8AFF5A}.c-arany{color:#FFD700}.c-pink{color:#FF69B4}.c-lila{color:#C084FC}.c-turkiz{color:#40E0D0}.c-korall{color:#FF7F50}.c-vzold{color:#32CD32}.c-indigo{color:#6366F1}.c-borostyan{color:#FFBF00}.c-ibolya{color:#8A2BE2}.c-egszin{color:#7DD3FC}
.effects-row{margin-top:8px;display:flex;align-items:center;gap:6px;width:100%}
.effects-label{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.32);white-space:nowrap;flex:0 0 auto}
.effects-line{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;scroll-behavior:smooth;min-height:30px;align-items:center}
.effects-line::-webkit-scrollbar{display:none}
.eff-btn{flex:0 0 auto;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:10.5px;cursor:pointer;white-space:nowrap}
.eff-btn.matrix{border-color:#00FF41;color:#00FF41;background:rgba(0,255,65,.1)}
.eff-btn.rand{border-color:#B6FF5A;color:#B6FF5A;background:linear-gradient(135deg,rgba(182,255,90,.18),rgba(0,255,255,.1));font-weight:800}
.eNav{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:grid;place-items:center}
.main{width:min(980px,92vw);margin:18px auto;padding-bottom:30px}
.drop{padding:22px;border-radius:18px;border:1px dashed rgba(255,255,255,.16);background:rgba(20,22,30,.6);text-align:center;transition:.2s}
.drop.drag{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.file-list{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.file-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:13px}
.file-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:grid;place-items:center}
.file-row button.del{border-color:rgba(255,60,60,.3);color:#FF6B6B;background:rgba(255,60,60,.08)}
.progress{width:100%;height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:10px 0}
.progress-bar{height:100%;background:var(--a);width:0%;transition:width .3s;border-radius:999px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-import{padding:10px 18px;border-radius:12px;border:0;cursor:pointer;font-weight:700;font-size:13px}
.btn-rt{background:#00FFC8;color:#000}
.btn-del{background:#C81E1E;color:#fff;display:flex;align-items:center;gap:6px}
.btn-json{background:#E6FF00;color:#000;display:flex;align-items:center;gap:6px}
.gen-row{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:14px;background:rgba(0,255,255,.06);border:1px solid rgba(0,255,255,.14)}
.btn{padding:12px 24px;border-radius:999px;border:0;background:var(--a);color:#000;font-weight:800;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.count{font-family:Geist Mono,monospace;font-size:12px;color:rgba(255,255,255,.45)}
.effect-glow #title{color:var(--a);text-shadow:0 0 10px var(--a),0 0 22px var(--a)}
.effect-neon{border-bottom:1px solid var(--a)!important;box-shadow:0 0 22px rgba(0,255,0,.2)}
.effect-gradient #title{background:linear-gradient(90deg,var(--a),#FF00FF,#FFFF00,var(--a));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:300% 100%;animation:grad 2s linear infinite}
@keyframes grad{0%{background-position:0%}100%{background-position:300%}}
.effect-aurora{background:radial-gradient(600px 180px at 20% 0%,rgba(0,255,0,.16),transparent),radial-gradient(500px 160px at 80% 0%,rgba(255,0,255,.12),transparent),var(--panel)!important}
.effect-mono #title{font-family:Geist Mono,monospace;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px}
.effect-serif #title{font-family:Instrument Serif,serif;font-style:italic;font-size:18px;font-weight:400}
.effect-space #title{font-family:Space Grotesk,sans-serif;font-weight:700}
.effect-code #title{font-family:JetBrains Mono,monospace;font-weight:700}
#matrixCanvas{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:.5s}
#matrixCanvas.on{opacity:.38}
</style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>
<div class="top" id="top">
<div class="top-row">
<div class="dot" id="dot"></div>
<div class="center"><div class="pill"><div id="title" contenteditable="true" spellcheck="false">SECURICS • FÉNY SZÍN MATRIX 50KOMBO • F5 MENTES</div></div></div>
<input id="swatch" type="color" value="#00FF00"/>
<span id="hex">#00FF00</span>
<div class="custom-dropdown" id="colorDropdown">
<button class="dd-trigger" id="colorTrigger"><span class="left"><span class="star c-zold">★</span><span>Zöld [ALAP]</span></span><span class="arrow">▼</span></button>
<div class="dd-menu" id="colorMenu"></div>
</div>
</div>
<div class="effects-row">
<span class="effects-label">EFFEKTEK →</span>
<button class="eNav" id="eLeft">‹</button>
<div class="effects-line" id="effectsLine"></div>
<button class="eNav" id="eRight">›</button>
<button class="eff-btn rand" id="randBtn">🎲 VÉLETLEN 50+</button>
<button class="eff-btn rand" id="megaRandBtn" title="Több ezer véletlen effektuskombináció">✨ 5000+ EFFEKT</button>
</div>
</div>
<div class="main">
<div class="drop" id="drop">
<div style="font-weight:700;margin-bottom:6px">Dobd ide a HTML fájlokat (max 20) - F5 után megmarad téma + betű</div>
<div style="font-size:11px;color:rgba(255,255,255,.45);margin-bottom:12px">DELETE FIX • localStorage • F5 után is marad • dropdown • MATRIX</div>
<input type="file" id="fileInput" accept=".html,.htm" multiple hidden/>
<input type="file" id="jsonInput" accept=".json" hidden/>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px">
<button class="btn-import btn-rt" id="pickBtn">IMPORT HTML</button>
<button class="btn-import btn-del" id="bulkDelBtn">🗑️ DEL</button>
<button class="btn-import btn-json" id="importJsonBtn">📦 IMPORT JSON</button>
</div>
<div class="count" id="count" style="margin-top:10px">0 eszköz • 0%</div>
</div>
<div class="file-list" id="fileList"></div>
<div class="gen-row" id="genRow" style="display:none">
<button class="btn" id="genBtn">ULTIMATE Generálás (0 eszköz)</button>
<label style="font-size:12px;color:rgba(255,255,255,.6);display:flex;gap:6px;align-items:center"><input type="checkbox" id="googleMode"/> Google mód</label>
</div>
</div>
<script>
const COLORS=[
 {id:"zold",name:"Zöld [ALAP]",hex:"#00FF00",cls:"c-zold",icon:"★"},
 {id:"cian",name:"Cián [ALAP]",hex:"#00FFFF",cls:"c-cian",icon:"★"},
 {id:"sarga",name:"Sárga [ALAP]",hex:"#FFFF00",cls:"c-sarga",icon:"★"},
 {id:"magenta",name:"Magenta [ALAP]",hex:"#FF00FF",cls:"c-magenta",icon:"★"},
 {id:"narancs",name:"Narancs [ALAP]",hex:"#FF8800",cls:"c-narancs",icon:"★"},
 {id:"piros",name:"Piros [ALAP]",hex:"#FF0000",cls:"c-piros",icon:"★"},
 {id:"kek",name:"Kék [ALAP]",hex:"#2A7FFF",cls:"c-kek",icon:"★"},
 {id:"feher",name:"Fehér [ALAP]",hex:"#FFFFFF",cls:"c-feher",icon:"★"},
 {id:"menta",name:"Menta",hex:"#5AFFB6",cls:"c-menta",icon:"•"},
 {id:"lime",name:"Lime",hex:"#8AFF5A",cls:"c-lime",icon:"•"},
 {id:"arany",name:"Arany",hex:"#FFD700",cls:"c-arany",icon:"•"},
 {id:"pink",name:"Pink",hex:"#FF69B4",cls:"c-pink",icon:"•"},
 {id:"lila",name:"Lila",hex:"#C084FC",cls:"c-lila",icon:"•"},
 {id:"turkiz",name:"Türkiz",hex:"#40E0D0",cls:"c-turkiz",icon:"•"},
 {id:"korall",name:"Korall",hex:"#FF7F50",cls:"c-korall",icon:"•"},
 {id:"vzold",name:"V.Zöld",hex:"#32CD32",cls:"c-vzold",icon:"•"},
 {id:"indigo",name:"Indigó",hex:"#6366F1",cls:"c-indigo",icon:"•"},
 {id:"borostyan",name:"Borostyán",hex:"#FFBF00",cls:"c-borostyan",icon:"•"},
 {id:"ibolya",name:"Ibolya",hex:"#8A2BE2",cls:"c-ibolya",icon:"•"},
 {id:"egszin",name:"Égszín",hex:"#7DD3FC",cls:"c-egszin",icon:"•"}
];
let files=[];
let currentColor=COLORS[0];
let matrixTimer=null;

function saveSettings(){
 try{
   const top=document.getElementById("top");
   const effects=[];
   ["effect-glow","effect-neon","effect-gradient","effect-aurora"].forEach(c=>{ if(top.classList.contains(c)) effects.push(c); });
   let font="";
   ["effect-mono","effect-serif","effect-space","effect-code"].forEach(c=>{ if(top.classList.contains(c)) font=c; });
   const data={
     accent: document.getElementById("swatch").value,
     title: document.getElementById("title").textContent,
     effects: effects,
     font: font,
     bg: document.body.style.background||"",
     colorId: currentColor.id,
     ts: Date.now()
   };
   localStorage.setItem("securics_v30_all", JSON.stringify(data));
   // also old keys for compat
   localStorage.setItem("securics_v19_accent", data.accent);
   localStorage.setItem("securics_v19_title", data.title);
   localStorage.setItem("securics_v19_effects", JSON.stringify(data.effects));
   localStorage.setItem("securics_v19_font", data.font);
   localStorage.setItem("securics_v19_bg", data.bg);
   localStorage.setItem("securics_v19_colorId", data.colorId);
   console.log("MENTVE F5-re V30:", data);
   const cnt=document.getElementById("count");
   if(cnt) cnt.textContent=files.length+" eszköz • F5 mentve: "+data.accent+" + "+(data.font||"alap")+" - fejléc megmarad!";
 }catch(e){ console.log("save hiba",e); }
}
function loadSettings(){
 try{
   let data=null;
   const raw=localStorage.getItem("securics_v30_all");
   if(raw){
     data=JSON.parse(raw);
   } else {
     // fallback old keys
     const acc=localStorage.getItem("securics_v19_accent");
     if(acc){
       data={
         accent: acc,
         title: localStorage.getItem("securics_v19_title")||"",
         effects: JSON.parse(localStorage.getItem("securics_v19_effects")||"[]"),
         font: localStorage.getItem("securics_v19_font")||"",
         bg: localStorage.getItem("securics_v19_bg")||"",
         colorId: localStorage.getItem("securics_v19_colorId")||"zold"
       };
     }
   }
   if(!data) return false;
   console.log("BETÖLTVE F5 után V30:", data);
   if(data.accent){ applyColor(data.accent, false); }
   if(data.colorId){
     const col=COLORS.find(c=>c.id===data.colorId);
     if(col){
       currentColor=col;
       document.getElementById("colorTrigger").innerHTML='<span class="left"><span class="star '+col.cls+'">'+col.icon+'</span><span>'+col.name+'</span></span><span class="arrow">▼</span>';
     }
   }
   if(data.title){ document.getElementById("title").textContent=data.title; }
   if(data.effects){
     const top=document.getElementById("top");
     data.effects.forEach(c=>top.classList.add(c));
   }
   if(data.font){
     const top=document.getElementById("top");
     top.classList.remove("effect-mono","effect-serif","effect-space","effect-code");
     if(data.font) top.classList.add(data.font);
   }
   if(data.bg && data.bg!==""){ document.body.style.background=data.bg; }
   return true;
 }catch(e){ console.log("load hiba",e); return false; }
}
function applyColor(hex, save=true){
 document.documentElement.style.setProperty("--a",hex);
 document.getElementById("swatch").value=hex;
 document.getElementById("hex").textContent=hex.toUpperCase();
 const dot=document.getElementById("dot");
 dot.style.background=hex;
 dot.style.boxShadow="0 0 16px "+hex;
 const bar=document.getElementById("progressBar");
 if(bar) bar.style.background=hex;
 if(save) saveSettings();
}
function syncH(){
 const top=document.getElementById("top");
 document.documentElement.style.setProperty("--hh",top.offsetHeight+"px");
}
function b64Encode(str){
 try{ return btoa(unescape(encodeURIComponent(str))); }
 catch(e){ return btoa(str); }
}
function updateProgress(){
 const bar=document.getElementById("progressBar");
 const cnt=document.getElementById("count");
 const pct=Math.min(100, Math.round((files.length/20)*100));
 bar.style.width=pct+"%";
 cnt.textContent=files.length+" eszköz • "+pct+"% • F5 után megmarad";
}
function renderFiles(){
 const list=document.getElementById("fileList");
 const genRow=document.getElementById("genRow");
 list.innerHTML="";
 document.getElementById("genBtn").textContent="ULTIMATE Generálás ("+files.length+" eszköz) - F5 MENTES";
 document.getElementById("genBtn").disabled=files.length===0;
 genRow.style.display=files.length?"flex":"none";
 updateProgress();
 for(let i=0;i<files.length;i++){
   const f=files[i];
   const row=document.createElement("div");
   row.className="file-row";
   row.dataset.index=i;
   const nameSpan=document.createElement("span");
   nameSpan.className="name";
   nameSpan.textContent=(i+1)+". "+f.name;
   const sizeSpan=document.createElement("span");
   sizeSpan.style.fontSize="11px";
   sizeSpan.style.color="rgba(255,255,255,.45)";
   sizeSpan.textContent=(f.size/1024).toFixed(1)+" KB";
   const upBtn=document.createElement("button"); upBtn.textContent="↑"; upBtn.title="Fel";
   const downBtn=document.createElement("button"); downBtn.textContent="↓"; downBtn.title="Le";
   const delBtn=document.createElement("button"); delBtn.textContent="×"; delBtn.title="Törlés"; delBtn.className="del";
   (function(idx){
     upBtn.addEventListener("click",function(){ moveFile(idx, -1); });
     downBtn.addEventListener("click",function(){ moveFile(idx, 1); });
     delBtn.addEventListener("click",function(){ deleteFile(idx); });
   })(i);
   row.appendChild(nameSpan);
   row.appendChild(sizeSpan);
   row.appendChild(upBtn);
   row.appendChild(downBtn);
   row.appendChild(delBtn);
   list.appendChild(row);
 }
 syncH();
}
function deleteFile(index){
 if(index>=0 && index<files.length){
   files.splice(index,1);
   renderFiles();
 }
}
function bulkDelete(){
 if(files.length===0) return;
 if(confirm("Biztosan törlöd az összes ("+files.length+") fájlt?")){
   files=[];
   renderFiles();
   document.getElementById("fileInput").value="";
   document.getElementById("jsonInput").value="";
 }
}
function moveFile(index, dir){
 if(dir===-1 && index>0){
   const t=files[index]; files[index]=files[index-1]; files[index-1]=t; renderFiles();
 }
 if(dir===1 && index<files.length-1){
   const t=files[index]; files[index]=files[index+1]; files[index+1]=t; renderFiles();
 }
}
function addFiles(fileList){
 var arr=Array.from(fileList).slice(0,20-files.length);
 var pending=arr.length;
 if(pending===0) return;
 arr.forEach(function(file){
   var r=new FileReader();
   r.onload=function(e){
     files.push({name:file.name,size:file.size,content:b64Encode(e.target.result)});
     pending--;
     if(pending===0) renderFiles();
   };
   r.readAsText(file);
 });
 document.getElementById("fileInput").value="";
}
function startMatrix(){
 var c=document.getElementById("matrixCanvas");
 c.classList.add("on");
 var ctx=c.getContext("2d");
 c.width=window.innerWidth; c.height=window.innerHeight;
 var chars="SECURICS01アイウエオカキクケコABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
 var cols=Math.floor(c.width/14);
 var drops=[];
 for(var i=0;i<cols;i++) drops[i]=Math.random()*-20;
 function draw(){
   ctx.fillStyle="rgba(0,0,0,0.05)";
   ctx.fillRect(0,0,c.width,c.height);
   ctx.fillStyle="#00FF41";
   ctx.font="14px JetBrains Mono, monospace";
   for(var i=0;i<drops.length;i++){
     var ch=chars.charAt(Math.floor(Math.random()*chars.length));
     ctx.fillText(ch,i*14,drops[i]*14);
     if(drops[i]*14>c.height && Math.random()>0.975) drops[i]=0;
     drops[i]++;
   }
 }
 if(matrixTimer) clearInterval(matrixTimer);
 matrixTimer=setInterval(draw,42);
}
function stopMatrix(){
 var c=document.getElementById("matrixCanvas");
 c.classList.remove("on");
 if(matrixTimer){ clearInterval(matrixTimer); matrixTimer=null; }
 var ctx=c.getContext("2d");
 if(ctx) ctx.clearRect(0,0,c.width,c.height);
}

document.addEventListener("DOMContentLoaded",function(){
 var colorMenu=document.getElementById("colorMenu");
 var colorTrigger=document.getElementById("colorTrigger");
 COLORS.forEach(function(col){
   var item=document.createElement("div");
   item.className="dd-item";
   if(col.id===currentColor.id) item.classList.add("active");
   item.innerHTML='<span class="star '+col.cls+'">'+col.icon+'</span><span class="label">'+col.name+'</span>';
   item.addEventListener("click",function(){
     currentColor=col;
     applyColor(col.hex);
     colorTrigger.innerHTML='<span class="left"><span class="star '+col.cls+'">'+col.icon+'</span><span>'+col.name+'</span></span><span class="arrow">▼</span>';
     var all=colorMenu.querySelectorAll(".dd-item");
     for(var j=0;j<all.length;j++) all[j].classList.remove("active");
     item.classList.add("active");
     colorMenu.classList.remove("open");
     saveSettings();
   });
   colorMenu.appendChild(item);
 });
 colorTrigger.addEventListener("click",function(){ colorMenu.classList.toggle("open"); });

 const line=document.getElementById("effectsLine");
 var quick=[
   {l:"Glow betű",cls:"effect-glow"},
   {l:"Neon keret",cls:"effect-neon"},
   {l:"Gradient",cls:"effect-gradient"},
   {l:"Aurora",cls:"effect-aurora"},
   {l:"Mono",cls:"effect-mono"},
   {l:"Serif",cls:"effect-serif"},
   {l:"Space",cls:"effect-space"},
   {l:"🟩 MATRIX",matrix:true},
   {l:"Stop",matrixStop:true}
 ];
 quick.forEach(function(eff){
   var b=document.createElement("button");
   b.className="eff-btn";
   if(eff.matrix) b.className+=" matrix";
   b.textContent=eff.l;
   b.addEventListener("click",function(){
     var top=document.getElementById("top");
     if(eff.matrix){ startMatrix(); return; }
     if(eff.matrixStop){ stopMatrix(); return; }
     var isFont=["effect-mono","effect-serif","effect-space","effect-code"].indexOf(eff.cls)!==-1;
     if(isFont){
       top.classList.remove("effect-mono","effect-serif","effect-space","effect-code");
       top.classList.add(eff.cls);
     } else {
       top.classList.toggle(eff.cls);
     }
     saveSettings();
     syncH();
   });
   line.appendChild(b);
 });

 document.getElementById("eLeft").addEventListener("click",function(){ line.scrollBy({left:-200,behavior:"smooth"}); });

 document.getElementById("randBtn").addEventListener("click",function(){

 function hslToHex(h,s,l){
   s/=100;l/=100;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;
   if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
   return "#"+[r,g,b].map(function(v){return Math.round((v+m)*255).toString(16).padStart(2,"0");}).join("").toUpperCase();
 }

 document.getElementById("jsonInput").addEventListener("change",function(e){
   if(!e.target.files.length) return;
   var file=e.target.files[0];
   var r=new FileReader();
   r.onload=function(ev){
     try{
       var data=JSON.parse(ev.target.result);
       if(Array.isArray(data)){
         files=[];
         data.forEach(function(item){
           if(item.name && item.b64){ files.push({name:item.name,size:Math.round(item.b64.length*0.75),content:item.b64}); }
           else if(item.name && item.content){ files.push({name:item.name,size:item.content.length,content:b64Encode(item.content)}); }
         });
         renderFiles();
       }
     }catch(err){ alert("JSON hiba: "+err.message); }
   };
   r.readAsText(file);
   e.target.value="";
 });
